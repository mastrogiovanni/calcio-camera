plugins { id 'com.android.application' }

android {
    namespace 'it.calciocamera'
    compileSdk {
        version = release(36) { it.minorApiLevel = 1 }
    }
    defaultConfig {
        applicationId 'it.calciocamera'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'it.calciocamera.NdiInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('verifyNdiRuntime') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libndi.so').exists()) {
            throw new GradleException('Runtime NDI Android mancante. Vedi README.md e scripts/import-ndi.py.')
        }
    }
}
tasks.register('assembleNdiDebug') {
    dependsOn 'verifyNdiRuntime'
    dependsOn 'assembleDebug'
}
